name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The repo uses bun.lock, so install with bun (npm ci needs package-lock.json).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          BASE_PATH: /horizoninnovate/

      - name: Prepare static output
        run: |
          OUT=""
          for d in .output/public dist/client; do
            if [ -d "$d" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then
            echo "No static output folder found"; ls -la . .output dist 2>/dev/null || true; exit 1
          fi
          # TanStack Start SPA mode may name the shell _shell.html instead of index.html
          if [ ! -f "$OUT/index.html" ] && [ -f "$OUT/_shell.html" ]; then
            cp "$OUT/_shell.html" "$OUT/index.html"
          fi
          if [ ! -f "$OUT/index.html" ]; then
            echo "No index.html in $OUT"; ls -la "$OUT"; exit 1
          fi
          # GitHub Pages has no server routing: 404.html makes deep links load the app
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

      - id: deployment
        uses: actions/deploy-pages@v4
